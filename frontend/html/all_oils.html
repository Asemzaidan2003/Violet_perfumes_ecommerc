<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة الزيوت</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">المخزون</span>
        <h2>🛢️ جميع الزيوت المتوفرة</h2>
      </div>
    </div>

    <div class="stats" id="capitalStats" style="display: none;">
      <div class="stat-card">
        <div class="label">المخزون المتوفر</div>
        <div class="value" id="stockValue">0 <small>مل</small></div>
      </div>
      <div class="stat-card accent">
        <div class="label">رأس المال</div>
        <div class="value" id="capitalValue">0 <small>JOD</small></div>
      </div>
    </div>

    <div class="filters">
      <label>
        ابحث برقم الزيت
        <input type="text" id="searchId" placeholder="ID" />
      </label>
      <label>
        ابحث باسم الزيت
        <input type="text" id="searchName" placeholder="اسم الزيت" />
      </label>
      <label>
        ترتيب حسب
        <select id="sortBy">
          <option value="">- ترتيب حسب -</option>
          <option value="quantity_low">الكمية (الأقل الى الأعلى)</option>
          <option value="cost_low">الكلفة (الأقل الى الأعلى)</option>
          <option value="quantity_high">الكمية (الأعلى الى الأقل)</option>
          <option value="cost_high">الكلفة (الأعلى الى الأقل)</option>
        </select>
      </label>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table id="oilTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>الاسم</th>
              <th>الكلفة</th>
              <th>الكمية</th>
              <th>كلفة الكمية</th>
              <th>الحالة</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr class="loading-row"><td colspan="7"><span class="spinner"></span>جاري تحميل الزيوت...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let oilsData = [];

    async function fetchOils() {
      try {
        const res = await fetch("http://localhost:5000/api/oils");
        const json = await res.json();
        oilsData = json.data;
        renderTable(oilsData);
        getOilCapital();
      } catch (err) {
        console.error("حدث خطأ في جلب البيانات", err);
      }
    }

    async function getOilCapital() {
      try {
        const res = await fetch("http://localhost:5000/api/oils/calculate_oil_capital");
        const json = await res.json();
        renderOilCapital(json.data);
      } catch (err) {
        console.error("حدث خطأ في جلب البيانات", err);
      }
    }

    function statusBadgeClass(status) {
      return status === "available" ? "badge-available" : "badge-out";
    }

    function statusLabel(status) {
      return status === "available" ? "متوفر" : "غير متوفر";
    }

    function renderTable(data) {
      const tbody = document.querySelector("#oilTable tbody");

      if (!data.length) {
        tbody.innerHTML = `
          <tr><td colspan="7">
            <div class="empty-state">
              <div class="icon">🛢️</div>
              <div class="title">لا توجد زيوت مطابقة</div>
              <div>جرّب تعديل البحث</div>
            </div>
          </td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(oil => {
        const quantityCost = (oil.oil_cost * oil.oil_quantity).toFixed(2);
        return `
          <tr>
            <td class="num">${oil.id}</td>
            <td class="cell-strong">${oil.oil_name}</td>
            <td class="num">${oil.oil_cost.toFixed(2)} JD</td>
            <td class="num">${oil.oil_quantity} ml</td>
            <td class="num">${quantityCost} JD</td>
            <td><span class="badge ${statusBadgeClass(oil.status)}">${statusLabel(oil.status)}</span></td>
            <td><button class="btn btn-secondary btn-sm" onclick="sendOilId('${oil.id}')">تعديل</button></td>
          </tr>
        `;
      }).join("");
    }

    function renderOilCapital(data) {
      document.getElementById("capitalStats").style.display = "grid";
      document.getElementById("stockValue").innerHTML = `${data.quantity} <small>مل</small>`;
      document.getElementById("capitalValue").innerHTML = `${Number(data.capital).toFixed(2)} <small>JOD</small>`;
    }

    document.getElementById("searchId").addEventListener("input", filterOils);
    document.getElementById("searchName").addEventListener("input", filterOils);
    document.getElementById("sortBy").addEventListener("change", filterOils);

    function filterOils() {
      const searchId = document.getElementById("searchId").value.toLowerCase();
      const searchName = document.getElementById("searchName").value.toLowerCase();
      const sortBy = document.getElementById("sortBy").value;

      let filtered = oilsData.filter(oil =>
        oil.id.toLowerCase().includes(searchId) &&
        oil.oil_name.toLowerCase().includes(searchName)
      );

      if (sortBy === "quantity_low") {
        filtered.sort((high, low) => high.oil_quantity - low.oil_quantity);
      } else if (sortBy === "cost_low") {
        filtered.sort((high, low) => high.oil_cost - low.oil_cost);
      } else if (sortBy === "quantity_high") {
        filtered.sort((high, low) => low.oil_quantity - high.oil_quantity);
      } else if (sortBy === "cost_high") {
        filtered.sort((high, low) => low.oil_cost - high.oil_cost);
      }

      renderTable(filtered);
    }

    function sendOilId(oilId) {
      window.location.href = `update_oil.html?id=${encodeURIComponent(oilId)}`;
    }

    fetchOils();
  </script>
  <script src="../js/navbar.js"></script>
</body>
</html>
