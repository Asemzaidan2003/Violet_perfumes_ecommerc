<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأقسام</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">لوحة التحكم</span>
        <h2>الأقسام</h2>
      </div>
      <button type="button" class="btn btn-primary" id="addCategoryBtn">+ إضافة قسم</button>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>الاسم بالعربية</th><th>الرابط</th><th>عدد المنتجات</th><th>الترتيب</th><th>ظاهر</th><th></th>
            </tr>
          </thead>
          <tbody id="categoriesBody">
            <tr class="loading-row"><td colspan="6"><span class="spinner"></span>جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="categoryModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
    <div class="modal-box">
      <button type="button" class="modal-close" id="categoryClose" aria-label="إغلاق">✕</button>
      <h3 id="categoryModalTitle">إضافة قسم</h3>
      <form id="categoryForm">
        <div class="field">
          <label for="cf-key">المفتاح</label>
          <input type="text" id="cf-key" maxlength="31" pattern="[A-Za-z](?:[A-Za-z0-9]|-|_){1,30}" placeholder="Men">
        </div>
        <div class="field">
          <label for="cf-slug">الرابط (slug)</label>
          <input type="text" id="cf-slug" maxlength="40" pattern="(?:[a-z0-9]|-){2,40}" required>
        </div>
        <div class="field">
          <label for="cf-name-ar">الاسم بالعربية</label>
          <input type="text" id="cf-name-ar" maxlength="40" required>
        </div>
        <div class="field">
          <label for="cf-name-en">الاسم بالإنجليزية</label>
          <input type="text" id="cf-name-en" maxlength="40">
        </div>
        <div class="field">
          <label for="cf-icon">الأيقونة</label>
          <select id="cf-icon">
            <option value="">بدون</option>
            <option value="cube">صندوق</option>
            <option value="home">منزل</option>
            <option value="grid">شبكة</option>
            <option value="truck">شاحنة</option>
            <option value="wallet">محفظة</option>
          </select>
        </div>
        <div class="field">
          <label for="cf-image">الصورة</label>
          <input type="text" id="cf-image" placeholder="https://... أو ارفع صورة">
          <label class="drop-zone" for="cf-image-file">اسحب صورة هنا أو اضغط للاختيار</label>
          <input type="file" id="cf-image-file" accept="image/jpeg,image/png,image/webp" style="display:none">
          <p class="upload-status" role="status" id="cf-upload-status"></p>
          <img id="cf-image-preview" alt="" style="max-width:80px;display:none;margin-top:8px">
        </div>
        <div class="field">
          <label for="cf-visible">ظاهر</label>
          <input type="checkbox" id="cf-visible" checked>
        </div>
        <p id="categoryError" role="alert" hidden></p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block" id="categorySave">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/categories.js"></script>
</body>
</html>
