<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تصنيف المنتجات</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">الكتالوج</span>
        <h2>تصنيف المنتجات</h2>
      </div>
    </div>

    <div class="filters">
      <label class="chip-check">
        <input type="checkbox" id="unclassifiedOnly">
        غير المصنّفة فقط
      </label>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table id="catalogTable">
          <thead>
            <tr>
              <th>الصورة</th>
              <th>الاسم</th>
              <th>الفئة</th>
              <th>العائلات العطرية</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="catalogBody">
            <tr class="loading-row"><td colspan="5"><span class="spinner"></span>جاري تحميل المنتجات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const el = (tag, props = {}, ...children) => {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    };

    let productsData = [];
    let CATEGORIES = [];
    let FAMILIES = [];

    function buildCategorySelect(current) {
      const select = el("select", { className: "status-select" },
        el("option", { value: "", textContent: "— اختر الفئة —" }),
        ...CATEGORIES.map((c) => el("option", { value: c.key, textContent: c.ar })));
      select.value = current ?? "";
      return select;
    }

    function buildFamilyChips(current) {
      return el("div", { className: "chip-group" }, ...FAMILIES.map((f) => el("label", { className: "chip-check" },
        el("input", { type: "checkbox", value: f.key, checked: current.includes(f.key) }),
        el("span", { className: "swatch", style: `background:${f.swatch}` }),
        f.ar)));
    }

    function buildRow(product) {
      const categorySelect = buildCategorySelect(product.p_category);
      const familyBox = buildFamilyChips(product.families ?? []);
      const status = el("span", { className: "text-muted" });
      const saveBtn = el("button", { type: "button", className: "btn btn-secondary btn-sm", textContent: "حفظ" });

      saveBtn.addEventListener("click", async () => {
        const families = [...familyBox.querySelectorAll("input:checked")].map((i) => i.value);
        const p_category = categorySelect.value;
        status.textContent = "جارٍ الحفظ…";
        status.className = "text-muted";
        try {
          const res = await fetch(`/api/products/${product._id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ p_category, families }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.message || "فشل الحفظ");
          product.p_category = p_category;
          product.families = families;
          status.textContent = "تم الحفظ ✓";
          status.className = "text-brand";
        } catch (err) {
          status.textContent = err.message;
          status.className = "text-muted";
        }
      });

      return el("tr", {},
        el("td", {}, el("img", { className: "row-thumb", src: product.p_image, alt: "" })),
        el("td", { className: "cell-strong", textContent: product.p_name }),
        el("td", {}, categorySelect),
        el("td", {}, familyBox),
        el("td", {}, saveBtn, status));
    }

    function emptyRow() {
      return el("tr", {}, el("td", { colSpan: 5 },
        el("div", { className: "empty-state" },
          el("div", { className: "icon", textContent: "📦" }),
          el("div", { className: "title", textContent: "لا توجد منتجات مطابقة" }))));
    }

    function renderRows() {
      const onlyUnclassified = document.getElementById("unclassifiedOnly").checked;
      const rows = productsData.filter((p) => !onlyUnclassified || !(p.families && p.families.length));
      const tbody = document.getElementById("catalogBody");
      tbody.replaceChildren(...(rows.length ? rows.map(buildRow) : [emptyRow()]));
    }

    document.getElementById("unclassifiedOnly").addEventListener("change", renderRows);

    async function init() {
      const vocab = await import("/assets/js/shared/vocab.js");
      CATEGORIES = vocab.CATEGORIES;
      FAMILIES = vocab.FAMILIES;
      const res = await fetch("/api/products");
      const json = await res.json();
      productsData = json.data ?? []; // getProducts responds 404 with no data when the catalogue is empty
      renderRows();
    }

    init();
  </script>
</body>
</html>
