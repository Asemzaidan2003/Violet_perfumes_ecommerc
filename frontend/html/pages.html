<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصفحات</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">لوحة التحكم</span>
        <h2>الصفحات</h2>
      </div>
      <button type="button" class="btn btn-primary" id="addPageBtn">+ إضافة صفحة</button>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>العنوان</th><th>الرابط</th><th>القسم</th><th>الترتيب</th><th>منشورة</th><th></th>
            </tr>
          </thead>
          <tbody id="pagesBody">
            <tr class="loading-row"><td colspan="6"><span class="spinner"></span>جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="pageModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="pageModalTitle">
    <div class="modal-box modal-box-wide">
      <button type="button" class="modal-close" id="pageClose" aria-label="إغلاق">✕</button>
      <h3 id="pageModalTitle">إضافة صفحة</h3>
      <form id="pageForm">
        <div class="field">
          <label for="pf-title">العنوان</label>
          <input type="text" id="pf-title" maxlength="80" required>
        </div>
        <div class="field">
          <label for="pf-slug">الرابط (slug)</label>
          <input type="text" id="pf-slug" maxlength="40" pattern="[a-z0-9\-]{2,40}" required>
        </div>
        <div class="field">
          <label for="pf-body">المحتوى</label>
          <div class="md-toolbar" role="toolbar" aria-label="أدوات التنسيق">
            <button type="button" class="btn btn-sm" data-md="h">H</button>
            <button type="button" class="btn btn-sm" data-md="b">B</button>
            <button type="button" class="btn btn-sm" data-md="list">قائمة</button>
            <button type="button" class="btn btn-sm" data-md="link">رابط</button>
          </div>
          <textarea id="pf-body" rows="10" maxlength="20000"></textarea>
        </div>
        <div class="field">
          <label>معاينة</label>
          <div id="pf-preview" class="page-content prose-preview"></div>
        </div>
        <div class="field">
          <label for="pf-meta">وصف الصفحة (meta description)</label>
          <input type="text" id="pf-meta" maxlength="160">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="pf-group">قسم التذييل</label>
            <select id="pf-group">
              <option value="info">معلومات</option>
              <option value="help">مساعدة</option>
              <option value="none">بدون</option>
            </select>
          </div>
          <div class="field">
            <label for="pf-published">منشورة</label>
            <input type="checkbox" id="pf-published" checked>
          </div>
        </div>
        <p id="pageError" role="alert" hidden></p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block" id="pageSave">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/pages.js"></script>
</body>
</html>
