<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تعديل الزجاجة</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page page-narrow">
    <div class="page-head">
      <div>
        <span class="eyebrow">المخزون</span>
        <h2>تعديل بيانات الزجاجة</h2>
      </div>
    </div>

    <form id="bottleForm" class="form-card">
      <div class="field">
        <label for="name">اسم الزجاجة</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="capacity">السعة (مل)</label>
          <input type="number" id="capacity" name="capacity" required />
        </div>
        <div class="field">
          <label for="cost">التكلفة (بالدينار)</label>
          <input type="number" step="0.01" id="cost" name="cost" required />
        </div>
      </div>

      <div class="field">
        <label for="quantity">الكمية المتوفرة</label>
        <input type="number" step="1" id="quantity" name="quantity" required />
      </div>

      <div class="field">
        <label for="add_quantity">إضافة كمية (وارد جديد)</label>
        <input type="number" id="add_quantity" name="add_quantity" min="0" step="1" />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">حفظ التعديلات</button>
      </div>
    </form>
  </div>

  <script>
    const baseURL = "/api/bottles";
    const params = new URLSearchParams(window.location.search);
    const bottleId = params.get("id");
    let loadedQuantity = 0;

    if (!bottleId) {
      alert("لا يوجد ID في الرابط!");
      window.location.href = "all_bottles.html";
    }

    async function loadBottle() {
      try {
        const res = await fetch(`${baseURL}/${bottleId}`);
        const json = await res.json();
        const data = json.data;

        document.getElementById("name").value = data.name;
        document.getElementById("capacity").value = data.capacity;
        document.getElementById("cost").value = data.cost;
        loadedQuantity = data.quantity;
        document.getElementById("quantity").value = loadedQuantity;
      } catch (err) {
        alert("فشل في تحميل بيانات الزجاجة");
        console.error(err);
      }
    }

    document.getElementById("bottleForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        capacity: parseInt(document.getElementById("capacity").value),
        cost: parseFloat(document.getElementById("cost").value),
      };
      const quantity = parseInt(document.getElementById("quantity").value);
      if (quantity !== loadedQuantity) {
        data.quantity = quantity;
      }
      const add_quantity = document.getElementById("add_quantity").value;
      if (add_quantity !== "" && parseFloat(add_quantity) > 0) {
        data.add_quantity = parseFloat(add_quantity);
      }

      try {
        const res = await fetch(`${baseURL}/${bottleId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        if (!res.ok) throw new Error("فشل التحديث");

        alert("تم تعديل البيانات بنجاح!");
        window.location.href = "all_bottles.html";
      } catch (error) {
        alert("حدث خطأ أثناء التحديث");
        console.error(error);
      }
    });

    loadBottle();
  </script>
</body>
</html>
