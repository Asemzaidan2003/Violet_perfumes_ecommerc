<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل الطلب</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>

<body>
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">الطلبات</span>
        <h2>تفاصيل الطلب</h2>
      </div>
      <a href="orders.html" class="btn btn-primary">الرجوع إلى الطلبات</a>
    </div>

    <div class="card card-pad mb-16" id="orderSummary">
      <div class="empty-state" style="padding: 24px;"><span class="spinner"></span>جاري تحميل التفاصيل...</div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>اسم العطر</th>
              <th>الحجم</th>
              <th>الكمية</th>
              <th>سعر البيع</th>
              <th>اسم الزجاجة</th>
              <th>الإيراد</th>
              <th>الكلفة</th>
              <th>الربح</th>
            </tr>
          </thead>
          <tbody id="productsTable"></tbody>
        </table>
      </div>
    </div>

    <div class="form-actions" id="confirmBar" style="display: none; margin-top: 16px;">
      <button class="btn btn-primary" id="confirmBtn">تأكيد الطلب وخصم المخزون</button>
    </div>
  </div>

  <script>
    const baseURL = "/api";

    async function fetchOrderDetails() {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get("id");
      if (!orderId) {
        alert("رقم الطلب غير موجود");
        return;
      }

      try {
        const res = await fetch(`${baseURL}/orders/${orderId}`);
        const data = await res.json();
        if (data.success === false) throw new Error("فشل في جلب الطلب");
        renderOrderDetails(data.data);
      } catch (err) {
        console.error("Error:", err);
        alert("حدث خطأ أثناء تحميل تفاصيل الطلب");
      }
    }

    function statusLabel(status) {
      const map = {
        pending: "قيد الانتظار",
        completed: "مكتمل",
        canceled: "ملغي",
        "ready for delivery": "جاهز للتوصيل",
        "in delivery": "قيد التوصيل",
        "uncollected payment": "دفعة غير مستلمة",
      };
      return map[status] || status;
    }

    function renderOrderDetails(order) {
      const summaryDiv = document.getElementById("orderSummary");
      summaryDiv.innerHTML = `
        <div class="summary-grid">
          <div class="item"><div class="label">الحالة</div><div class="val">${statusLabel(order.status)}</div></div>
          <div class="item"><div class="label">طريقة الدفع</div><div class="val">${order.payment_method}</div></div>
          <div class="item"><div class="label">عدد المنتجات</div><div class="val num">${order.total_items}</div></div>
          <div class="item"><div class="label">الإجمالي</div><div class="val num">${order.final_total.toFixed(2)} JOD</div></div>
          <div class="item"><div class="label">الربح</div><div class="val num">${order.total_profit.toFixed(2)} JOD</div></div>
          <div class="item"><div class="label">التكلفة الإجمالية</div><div class="val num">${order.total_cost} JOD</div></div>
          <div class="item"><div class="label">تاريخ الإنشاء</div><div class="val num">${new Date(order.createdAt).toLocaleDateString()}</div></div>
          <div class="item"><div class="label">ملاحظات</div><div class="val">${order.order_notes || "-"}</div></div>
          <div class="item"><div class="label">المصدر</div><div class="val">${order.source === "online" ? "الموقع" : "نقطة البيع"}</div></div>
          <div class="item"><div class="label">المخزون</div><div class="val">${order.stock_deducted === false ? "بانتظار التأكيد" : "تم الخصم"}</div></div>
        </div>
      `;

      const tbody = document.getElementById("productsTable");
      tbody.innerHTML = order.products.map((product, index) => `
        <tr>
          <td>${index + 1}</td>
          <td class="cell-strong">${product.p_name}</td>
          <td>${product.product_size}</td>
          <td>${product.quantity}</td>
          <td class="num">${product.selling_price.toFixed(2)}</td>
          <td>${product.bottle?.name || "-"}</td>
          <td class="num">${product.total_revenue.toFixed(2)}</td>
          <td class="num">${product.total_cost.toFixed(2)}</td>
          <td class="num">${product.total_profit.toFixed(2)}</td>
        </tr>
      `).join("");

      if (order.stock_deducted === false && order.status !== "canceled") renderConfirmForm(order);
    }

    // طلب من الموقع: اختيار الزجاجات ثم التأكيد لخصم المخزون
    async function renderConfirmForm(order) {
      const res = await fetch(`${baseURL}/bottles`);
      const bottles = (await res.json()).data || [];
      document.getElementById("productsTable").innerHTML = order.products.map((p, i) => {
        const options = bottles
          .filter((b) => b.capacity === parseFloat(p.product_size))
          .map((b) => `<option value="${b._id}">${b.name} (المتوفر: ${b.quantity})</option>`)
          .join("");
        return `
          <tr>
            <td>${i + 1}</td>
            <td class="cell-strong">${p.p_name}</td>
            <td>${p.product_size}</td>
            <td><input class="qty-input" type="number" min="1" step="1" id="qty-${i}" value="${p.quantity}"></td>
            <td><input class="price-input" type="number" min="0" step="0.01" id="price-${i}" value="${p.selling_price}"></td>
            <td><select id="bottle-${i}"><option value="">-- اختر زجاجة --</option>${options}</select></td>
            <td class="num">${p.total_revenue.toFixed(2)}</td>
            <td class="num">-</td>
            <td class="num">-</td>
          </tr>`;
      }).join("");
      document.getElementById("confirmBar").style.display = "";
      document.getElementById("confirmBtn").onclick = () => submitConfirm(order);
    }

    async function submitConfirm(order) {
      const lines = order.products.map((_, i) => ({
        bottle_id: document.getElementById(`bottle-${i}`).value,
        quantity: document.getElementById(`qty-${i}`).value,
        price: document.getElementById(`price-${i}`).value,
      }));
      if (lines.some((l) => !l.bottle_id)) return alert("يرجى اختيار زجاجة لكل منتج");
      const res = await fetch(`${baseURL}/orders/${order._id}/confirm`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lines }),
      });
      const data = await res.json();
      if (!res.ok) return alert(data.message || "تعذر تأكيد الطلب");
      let msg = "✅ تم تأكيد الطلب وخصم المخزون";
      if (data.shortages?.length) {
        msg += "\n\n⚠️ المخزون غير كافٍ لهذه المواد (تم تصفيرها):\n" +
          data.shortages.map((s) => `${s.item}: المطلوب ${s.needed}، المتوفر ${s.available}`).join("\n");
      }
      alert(msg);
      location.reload();
    }

    fetchOrderDetails();
  </script>
</body>

</html>
