<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إضافة زيت</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="page page-narrow">
    <div class="page-head">
      <div>
        <span class="eyebrow">المخزون</span>
        <h2>إضافة زيت جديد</h2>
      </div>
    </div>

    <form id="oilForm" class="form-card">
      <div class="field">
        <label for="id">رقم الزيت (ID)</label>
        <input type="text" id="id" name="id" />
      </div>

      <div class="field">
        <label for="oil_name">اسم الزيت</label>
        <input type="text" id="oil_name" name="oil_name" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="oil_cost">تكلفة الزيت (بالدينار)</label>
          <input type="number" step="0.01" id="oil_cost" name="oil_cost" />
        </div>
        <div class="field">
          <label for="oil_quantity">الكمية (مل)</label>
          <input type="number" id="oil_quantity" name="oil_quantity" />
        </div>
      </div>

      <div class="field">
        <label for="status">الحالة</label>
        <select id="status" name="status">
          <option value="available">متوفر</option>
          <option value="out_of_stock">غير متوفر</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">إرسال</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('oilForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const data = {
        id: document.getElementById('id').value,
        oil_name: document.getElementById('oil_name').value,
        oil_cost: parseFloat(document.getElementById('oil_cost').value),
        oil_quantity: parseInt(document.getElementById('oil_quantity').value),
        status: document.getElementById('status').value
      };

      try {
        const response = await fetch('http://localhost:5000/api/oils', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const result = await response.json();
        alert('تم الإرسال بنجاح!');
        window.location.reload();
      } catch (error) {
        alert('حدث خطأ أثناء الإرسال');
        console.error(error);
      }
    });
  </script>
  <script src="../js/navbar.js"></script>
</body>
</html>
