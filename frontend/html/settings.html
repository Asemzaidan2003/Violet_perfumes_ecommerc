<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إعدادات المتجر</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page page-narrow">
    <div class="page-head">
      <div>
        <span class="eyebrow">لوحة التحكم</span>
        <h2>إعدادات المتجر</h2>
      </div>
    </div>

    <form id="settingsForm" class="form-card">
      <h3>الهوية</h3>
      <div class="field">
        <label for="store_name">اسم المتجر</label>
        <input type="text" id="store_name" name="store_name" maxlength="40" required />
      </div>
      <div class="field">
        <label for="tagline">الشعار الفرعي</label>
        <input type="text" id="tagline" name="tagline" maxlength="80" />
      </div>

      <div class="field-row" id="logoFields">
        <div class="field">
          <label for="logo_light">الشعار (خلفية داكنة)</label>
          <input type="hidden" id="logo_light" name="logo_light" />
          <img id="logo_light_preview" alt="" style="max-height:48px;display:none" />
          <input type="file" id="logo_light_file" accept="image/jpeg,image/png,image/webp" />
          <button type="button" class="btn" id="logo_light_remove" hidden>إزالة</button>
        </div>
        <div class="field">
          <label for="logo_dark">الشعار (خلفية فاتحة)</label>
          <input type="hidden" id="logo_dark" name="logo_dark" />
          <img id="logo_dark_preview" alt="" style="max-height:48px;display:none" />
          <input type="file" id="logo_dark_file" accept="image/jpeg,image/png,image/webp" />
          <button type="button" class="btn" id="logo_dark_remove" hidden>إزالة</button>
        </div>
        <div class="field">
          <label for="favicon">أيقونة المتصفح (favicon)</label>
          <input type="hidden" id="favicon" name="favicon" />
          <img id="favicon_preview" alt="" style="max-height:32px;display:none" />
          <input type="file" id="favicon_file" accept="image/jpeg,image/png,image/webp" />
          <button type="button" class="btn" id="favicon_remove" hidden>إزالة</button>
        </div>
        <div class="field">
          <label for="share_image">صورة المشاركة (og:image)</label>
          <input type="hidden" id="share_image" name="share_image" />
          <img id="share_image_preview" alt="" style="max-height:48px;display:none" />
          <input type="file" id="share_image_file" accept="image/jpeg,image/png,image/webp" />
          <button type="button" class="btn" id="share_image_remove" hidden>إزالة</button>
        </div>
      </div>
      <p class="upload-status" role="status" id="identity-upload-status"></p>

      <div class="field">
        <label for="whatsapp">رقم واتساب (أرقام فقط، مثال: 962791234567)</label>
        <input type="text" id="whatsapp" name="whatsapp" placeholder="962791234567" />
      </div>

      <div class="field">
        <label for="instagram">رابط انستغرام</label>
        <input type="text" id="instagram" name="instagram" placeholder="https://instagram.com/nsamat" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="delivery_fee">رسوم التوصيل (دينار)</label>
          <input type="number" min="0" step="0.01" id="delivery_fee" name="delivery_fee" required />
        </div>
        <div class="field">
          <label for="free_delivery_over">توصيل مجاني فوق (دينار، 0 = معطّل)</label>
          <input type="number" min="0" step="0.01" id="free_delivery_over" name="free_delivery_over" required />
        </div>
      </div>

      <h3>ألوان المتجر</h3>
      <div class="field-row">
        <div class="field">
          <label for="theme_bg">لون الخلفية</label>
          <input type="color" id="theme_bg" name="theme_bg" />
        </div>
        <div class="field">
          <label for="theme_surface">لون السطح</label>
          <input type="color" id="theme_surface" name="theme_surface" />
        </div>
        <div class="field">
          <label for="theme_text">لون النص</label>
          <input type="color" id="theme_text" name="theme_text" />
        </div>
        <div class="field">
          <label for="theme_accent">لون التمييز</label>
          <input type="color" id="theme_accent" name="theme_accent" />
        </div>
      </div>

      <div id="themePreview" class="theme-preview" style="padding:16px;border-radius:8px">
        <p id="previewText" style="margin:0 0 8px">نص على الخلفية <span id="ratioBg"></span></p>
        <div id="previewSurface" style="padding:12px;border-radius:6px;margin-bottom:8px">
          <span id="previewSurfaceText">نص على السطح <span id="ratioSurface"></span></span>
        </div>
        <button type="button" id="previewAccentBtn" style="border:0;padding:8px 16px;border-radius:6px">زر بلون التمييز <span id="ratioAccent"></span></button>
        <p class="muted" style="margin:8px 0 0">نسب التباين إعلامية فقط، ولا تمنع الحفظ.</p>
      </div>

      <div class="form-actions">
        <button type="button" class="btn" id="resetThemeBtn">استعادة الألوان الافتراضية</button>
      </div>

      <details id="advancedColors">
        <summary>خيارات متقدمة</summary>
        <div class="field-row" id="advancedColorFields"></div>
      </details>

      <p id="error" role="alert" hidden></p>
      <p id="success" role="status" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="saveBtn" disabled>حفظ الإعدادات</button>
      </div>
    </form>
  </div>

  <script type="module" src="../js/settings.js"></script>
</body>
</html>
