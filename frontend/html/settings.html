<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إعدادات المتجر</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page page-narrow">
    <div class="page-head">
      <div>
        <span class="eyebrow">لوحة التحكم</span>
        <h2>إعدادات المتجر</h2>
      </div>
    </div>

    <form id="settingsForm" class="form-card">
      <div class="field">
        <label for="whatsapp">رقم واتساب (أرقام فقط، مثال: 962791234567)</label>
        <input type="text" id="whatsapp" name="whatsapp" placeholder="962791234567" />
      </div>

      <div class="field">
        <label for="instagram">رابط انستغرام</label>
        <input type="text" id="instagram" name="instagram" placeholder="https://instagram.com/nsamat" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="delivery_fee">رسوم التوصيل (دينار)</label>
          <input type="number" min="0" step="0.01" id="delivery_fee" name="delivery_fee" required />
        </div>
        <div class="field">
          <label for="free_delivery_over">توصيل مجاني فوق (دينار، 0 = معطّل)</label>
          <input type="number" min="0" step="0.01" id="free_delivery_over" name="free_delivery_over" required />
        </div>
      </div>

      <h3>ألوان المتجر</h3>
      <div class="field-row">
        <div class="field">
          <label for="theme_bg">لون الخلفية</label>
          <input type="color" id="theme_bg" name="theme_bg" />
        </div>
        <div class="field">
          <label for="theme_surface">لون السطح</label>
          <input type="color" id="theme_surface" name="theme_surface" />
        </div>
        <div class="field">
          <label for="theme_text">لون النص</label>
          <input type="color" id="theme_text" name="theme_text" />
        </div>
        <div class="field">
          <label for="theme_accent">لون التمييز</label>
          <input type="color" id="theme_accent" name="theme_accent" />
        </div>
      </div>

      <div id="themePreview" class="theme-preview" style="padding:16px;border-radius:8px">
        <p id="previewText" style="margin:0 0 8px">نص على الخلفية <span id="ratioBg"></span></p>
        <div id="previewSurface" style="padding:12px;border-radius:6px;margin-bottom:8px">
          <span id="previewSurfaceText">نص على السطح <span id="ratioSurface"></span></span>
        </div>
        <button type="button" id="previewAccentBtn" style="border:0;padding:8px 16px;border-radius:6px">زر بلون التمييز <span id="ratioAccent"></span></button>
      </div>

      <div class="form-actions">
        <button type="button" class="btn" id="resetThemeBtn">استعادة الألوان الافتراضية</button>
      </div>

      <p id="error" role="alert" hidden></p>
      <p id="success" role="status" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="saveBtn" disabled>حفظ الإعدادات</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById("settingsForm");
    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success");
    const saveBtn = document.getElementById("saveBtn");

    const DEFAULT_THEME = { bg: "#0E0C0A", surface: "#17130F", text: "#F4EDE3", accent: "#D4AF37" };
    const themeInputs = { bg: form.theme_bg, surface: form.theme_surface, text: form.theme_text, accent: form.theme_accent };

    // Same WCAG relative-luminance/contrast math as backend/store/theme.js, duplicated here so the
    // preview and the save-blocking check work without shipping a bundler for one small function.
    function contrast(hexA, hexB) {
      const lum = (hex) => {
        const n = parseInt(hex.slice(1), 16);
        const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((c) => {
          const v = c / 255;
          return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
        });
        return 0.2126 * r + 0.7152 * g + 0.0722 * b;
      };
      const [L1, L2] = [lum(hexA), lum(hexB)].sort((a, b) => b - a);
      return (L1 + 0.05) / (L2 + 0.05);
    }

    function currentTheme() {
      return { bg: themeInputs.bg.value, surface: themeInputs.surface.value, text: themeInputs.text.value, accent: themeInputs.accent.value };
    }

    function updatePreview() {
      const t = currentTheme();
      const r = { text_bg: contrast(t.text, t.bg), text_surface: contrast(t.text, t.surface), accent_bg: contrast(t.accent, t.bg) };
      document.getElementById("themePreview").style.background = t.bg;
      document.getElementById("themePreview").style.color = t.text;
      document.getElementById("previewSurface").style.background = t.surface;
      document.getElementById("previewAccentBtn").style.background = t.accent;
      document.getElementById("previewAccentBtn").style.color = t.text;
      document.getElementById("ratioBg").textContent = `(${r.text_bg.toFixed(1)}:1)`;
      document.getElementById("ratioSurface").textContent = `(${r.text_surface.toFixed(1)}:1)`;
      document.getElementById("ratioAccent").textContent = `(${r.accent_bg.toFixed(1)}:1)`;

    }

    Object.values(themeInputs).forEach((input) => input.addEventListener("input", updatePreview));

    document.getElementById("resetThemeBtn").addEventListener("click", async () => {
      for (const k of Object.keys(DEFAULT_THEME)) themeInputs[k].value = DEFAULT_THEME[k];
      updatePreview();
      await saveTheme();
    });

    // The form stays disabled until the current settings actually load — saving before that
    // would silently overwrite fields the admin never saw with client-side defaults (0/"").
    async function loadSettings() {
      try {
        const res = await fetch("/api/settings");
        if (!res.ok) throw new Error("تعذر تحميل الإعدادات");
        const { data } = await res.json();
        form.whatsapp.value = data.whatsapp || "";
        form.instagram.value = data.instagram || "";
        form.delivery_fee.value = data.delivery_fee ?? 0;
        form.free_delivery_over.value = data.free_delivery_over ?? 0;
        const theme = { ...DEFAULT_THEME, ...(data.theme || {}) };
        for (const k of Object.keys(DEFAULT_THEME)) themeInputs[k].value = theme[k];
        updatePreview();
        saveBtn.disabled = false;
      } catch (err) {
        console.error("Error loading settings:", err);
        errorEl.textContent = "تعذر تحميل الإعدادات — أعد تحميل الصفحة";
        errorEl.hidden = false;
      }
    }

    async function saveTheme() {
      const res = await fetch("/api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ theme: currentTheme() }),
      });
      const data = await res.json().catch(() => ({}));
      errorEl.hidden = true;
      successEl.hidden = true;
      if (!res.ok) {
        errorEl.textContent = data.message || "تعذر حفظ الإعدادات";
        errorEl.hidden = false;
        return false;
      }
      successEl.textContent = "تم حفظ الإعدادات ✓";
      successEl.hidden = false;
      return true;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      successEl.hidden = true;

      const body = {
        whatsapp: form.whatsapp.value.trim(),
        instagram: form.instagram.value.trim(),
        delivery_fee: Number(form.delivery_fee.value),
        free_delivery_over: Number(form.free_delivery_over.value),
        theme: currentTheme(),
      };

      const res = await fetch("/api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        errorEl.textContent = data.message || "تعذر حفظ الإعدادات";
        errorEl.hidden = false;
        return;
      }
      successEl.textContent = "تم حفظ الإعدادات ✓";
      successEl.hidden = false;
    });

    loadSettings();
  </script>
</body>
</html>
