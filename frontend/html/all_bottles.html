<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عرض جميع الزجاجات</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">المخزون</span>
        <h2>جميع الزجاجات</h2>
      </div>
      <button class="btn btn-secondary" onclick="fetchCapital()">📊 احسب رأس المال</button>
    </div>

    <div class="stats" id="capitalStats" style="display: none;">
      <div class="stat-card accent">
        <div class="label">رأس مال الزجاجات</div>
        <div class="value" id="capitalResult">0 <small>JOD</small></div>
      </div>
    </div>

    <div class="filters">
      <label>
        ابحث بالاسم
        <input type="text" id="searchName" placeholder="اسم الزجاجة" />
      </label>
      <label>
        ابحث بالرقم
        <input type="text" id="searchId" placeholder="ID" />
      </label>
      <label>
        ترتيب حسب
        <select id="sortOption">
          <option value="">-- اختر --</option>
          <option value="cost">السعر</option>
          <option value="quantity">الكمية</option>
        </select>
      </label>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>السعة (ml)</th>
              <th>السعر</th>
              <th>الكمية</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bottleTableBody">
            <tr class="loading-row"><td colspan="5"><span class="spinner"></span>جاري تحميل الزجاجات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const baseURL = '/api/bottles';
    let allBottles = [];

    async function fetchBottles() {
      try {
        const res = await fetch(baseURL);
        const json = await res.json();
        allBottles = json.data;
        renderBottles(allBottles);
      } catch (err) {
        console.error("Error fetching bottles:", err);
      }
    }

    function renderBottles(list) {
      const body = document.getElementById("bottleTableBody");

      if (!list.length) {
        body.innerHTML = `
          <tr><td colspan="5">
            <div class="empty-state">
              <div class="icon">🧴</div>
              <div class="title">لا توجد زجاجات مطابقة</div>
              <div>جرّب تعديل البحث</div>
            </div>
          </td></tr>`;
        return;
      }

      body.innerHTML = list.map(bottle => `
        <tr>
          <td class="cell-strong">${bottle.name}</td>
          <td class="num">${bottle.capacity}</td>
          <td class="num">${bottle.cost}</td>
          <td class="num">${bottle.quantity}</td>
          <td><button class="btn btn-secondary btn-sm" onclick="sendBottleId('${bottle._id}')">تعديل</button></td>
        </tr>
      `).join("");
    }

    function filterAndSort() {
      let filtered = [...allBottles];
      const name = document.getElementById("searchName").value.toLowerCase();
      const id = document.getElementById("searchId").value.toLowerCase();
      const sort = document.getElementById("sortOption").value;

      if (name) {
        filtered = filtered.filter(b => b.name.toLowerCase().includes(name));
      }

      if (id) {
        filtered = filtered.filter(b => b._id && b._id.toLowerCase().includes(id));
      }

      if (sort === "cost") {
        filtered.sort((a, b) => a.cost - b.cost);
      } else if (sort === "quantity") {
        filtered.sort((a, b) => b.quantity - a.quantity);
      }

      renderBottles(filtered);
    }

    function sendBottleId(id) {
      window.location.href = `update_bottle.html?id=${id}`;
    }

    document.getElementById("searchName").addEventListener("input", filterAndSort);
    document.getElementById("searchId").addEventListener("input", filterAndSort);
    document.getElementById("sortOption").addEventListener("change", filterAndSort);

    async function fetchCapital() {
      try {
        const res = await fetch(`${baseURL}/calculate_bottle_capital`);
        const json = await res.json();

        if (json.success) {
          document.getElementById("capitalStats").style.display = "grid";
          document.getElementById("capitalResult").innerHTML =
            `${json.data.quantity} <small>وحدة — ${json.data.capital.toFixed(2)} JOD</small>`;
        } else {
          alert("فشل الحساب");
          console.log("Failed to calculate capital:", json.message);
        }
      } catch (err) {
        console.error("خطأ في جلب رأس المال:", err);
        alert("حدث خطأ أثناء جلب البيانات");
      }
    }

    fetchBottles();
  </script>
</body>
</html>
