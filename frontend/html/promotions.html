<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>العروض والإعلانات</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">لوحة التحكم</span>
        <h2>العروض والإعلانات</h2>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="العروض والإعلانات">
      <button type="button" class="tab-btn active" id="tab-btn-placements" role="tab" aria-selected="true" aria-controls="tab-placements" data-tab="placements">الإعلانات</button>
      <button type="button" class="tab-btn" id="tab-btn-coupons" role="tab" aria-selected="false" tabindex="-1" aria-controls="tab-coupons" data-tab="coupons">أكواد الخصم</button>
    </div>

    <div class="tab-panel active" id="tab-placements" role="tabpanel" aria-labelledby="tab-btn-placements">
      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="addPlacementBtn">+ إضافة موضع</button>
      </div>
      <div id="placementGroups"></div>
    </div>

    <div class="tab-panel" id="tab-coupons" role="tabpanel" aria-labelledby="tab-btn-coupons">
      <div class="form-actions">
        <button type="button" class="btn btn-primary" id="addCouponBtn">+ إضافة كود</button>
      </div>
      <div class="table-card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>الكود</th><th>النوع/القيمة</th><th>النافذة</th><th>الاستخدام</th><th>نشط</th><th></th>
              </tr>
            </thead>
            <tbody id="couponsBody">
              <tr class="loading-row"><td colspan="6"><span class="spinner"></span>جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Placement add/edit modal -->
  <div id="placementModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="placementModalTitle">
    <div class="modal-box">
      <button type="button" class="modal-close" id="placementClose" aria-label="إغلاق">✕</button>
      <h3 id="placementModalTitle">إضافة موضع</h3>
      <form id="placementForm">
        <div class="field">
          <label for="pf-slot">الموضع</label>
          <select id="pf-slot" required></select>
        </div>
        <div class="field">
          <label for="pf-title">العنوان</label>
          <input type="text" id="pf-title" maxlength="80" required>
        </div>
        <div class="field">
          <label for="pf-subtitle">النص الفرعي</label>
          <input type="text" id="pf-subtitle" maxlength="160">
        </div>
        <div class="field">
          <label for="pf-image">رابط الصورة <span id="pf-image-hint" class="text-muted" hidden>(مطلوبة لهذا الموضع)</span></label>
          <input type="text" id="pf-image" placeholder="https://... أو ارفع صورة">
          <label class="drop-zone" for="pf-image-file">اسحب صورة هنا أو اضغط للاختيار</label>
          <input type="file" id="pf-image-file" accept="image/jpeg,image/png,image/webp" style="display:none">
          <p class="upload-status" role="status" id="pf-upload-status"></p>
        </div>
        <div class="field">
          <label for="pf-link">الرابط</label>
          <input type="text" id="pf-link" placeholder="/c/men أو https://...">
        </div>
        <div class="field">
          <label for="pf-cta">نص الزر</label>
          <input type="text" id="pf-cta" maxlength="30">
        </div>
        <div class="field">
          <label for="pf-theme">السمة</label>
          <select id="pf-theme"></select>
        </div>
        <div class="field-row" id="pf-target-wrap" hidden>
          <div class="field">
            <label for="pf-target-category">الفئة المستهدفة</label>
            <select id="pf-target-category"></select>
          </div>
          <div class="field">
            <label for="pf-target-family">العائلة المستهدفة</label>
            <select id="pf-target-family"></select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="pf-starts">يبدأ في</label>
            <input type="datetime-local" id="pf-starts">
          </div>
          <div class="field">
            <label for="pf-ends">ينتهي في</label>
            <input type="datetime-local" id="pf-ends">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="pf-sort">الترتيب</label>
            <input type="number" id="pf-sort" value="0">
          </div>
          <div class="field">
            <label for="pf-active">نشط</label>
            <input type="checkbox" id="pf-active" checked>
          </div>
        </div>
        <p id="placementError" role="alert" hidden></p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block" id="placementSave">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Coupon add/edit modal -->
  <div id="couponModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="couponModalTitle">
    <div class="modal-box">
      <button type="button" class="modal-close" id="couponClose" aria-label="إغلاق">✕</button>
      <h3 id="couponModalTitle">إضافة كود خصم</h3>
      <form id="couponForm">
        <div class="field">
          <label for="cf-code">الكود</label>
          <input type="text" id="cf-code" maxlength="20" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="cf-type">النوع</label>
            <select id="cf-type">
              <option value="percent">نسبة %</option>
              <option value="fixed">قيمة ثابتة</option>
            </select>
          </div>
          <div class="field">
            <label for="cf-value">القيمة</label>
            <input type="number" id="cf-value" step="0.01" min="0" required>
          </div>
        </div>
        <div class="field">
          <label for="cf-min">الحد الأدنى للطلب</label>
          <input type="number" id="cf-min" step="0.01" min="0" value="0">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="cf-starts">يبدأ في</label>
            <input type="datetime-local" id="cf-starts">
          </div>
          <div class="field">
            <label for="cf-ends">ينتهي في</label>
            <input type="datetime-local" id="cf-ends">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="cf-max">أقصى عدد استخدامات (0 = غير محدود)</label>
            <input type="number" id="cf-max" min="0" step="1" value="0">
          </div>
          <div class="field">
            <label for="cf-active">نشط</label>
            <input type="checkbox" id="cf-active" checked>
          </div>
        </div>
        <p id="couponError" role="alert" hidden></p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-block" id="couponSave">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/promotions.js"></script>
</body>
</html>
