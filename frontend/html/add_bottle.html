<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إضافة زجاجة</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page page-narrow">
    <div class="page-head">
      <div>
        <span class="eyebrow">المخزون</span>
        <h2>إضافة زجاجة جديدة</h2>
      </div>
    </div>

    <form id="bottleForm" class="form-card">
      <div class="field">
        <label for="name">اسم الزجاجة</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="capacity">السعة (مل)</label>
          <input type="number" id="capacity" name="capacity" required />
        </div>
        <div class="field">
          <label for="cost">التكلفة (بالدينار)</label>
          <input type="number" step="0.01" id="cost" name="cost" required />
        </div>
      </div>

      <div class="field">
        <label for="quantity">الكمية المتوفرة</label>
        <input type="number" id="quantity" name="quantity" required />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">إرسال</button>
      </div>
    </form>
  </div>

  <script>
    document
      .getElementById("bottleForm")
      .addEventListener("submit", async function (e) {
        e.preventDefault();

        const data = {
          name: document.getElementById("name").value,
          capacity: parseInt(document.getElementById("capacity").value),
          cost: parseFloat(document.getElementById("cost").value),
          quantity: parseInt(document.getElementById("quantity").value),
        };

        try {
          const response = await fetch("/api/bottles", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const result = await response.json();
          alert("تم الإرسال بنجاح!");
          window.location.reload();
        } catch (error) {
          alert("حدث خطأ أثناء الإرسال");
          console.error(error);
        }
      });
  </script>
</body>
</html>
