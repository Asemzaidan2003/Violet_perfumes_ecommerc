<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة المنتجات</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">الكتالوج</span>
        <h2>📦 جميع المنتجات</h2>
      </div>
    </div>

    <div class="filters">
      <label>
        ابحث باسم العطر
        <input type="text" id="searchName" placeholder="🔍 اسم العطر" />
      </label>
      <label>
        ابحث بالفئة
        <input type="text" id="searchCategory" placeholder="🎯 الفئة" />
      </label>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table id="productTable">
          <thead>
            <tr>
              <th>الصورة</th>
              <th>الاسم</th>
              <th>الفئة</th>
              <th>نسب التركيب</th>
              <th>الحالة</th>
              <th>الأحجام والأسعار</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr class="loading-row"><td colspan="7"><span class="spinner"></span>جاري تحميل المنتجات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let productsData = [];

    async function fetchProducts() {
      try {
        const res = await fetch("/api/products");
        const json = await res.json();
        productsData = json.data;
        renderTable(productsData);
      } catch (err) {
        console.error("فشل جلب المنتجات:", err);
      }
    }

    function statusBadgeClass(status) {
      if (status === "available") return "badge-available";
      if (status === "discontinued") return "badge-discontinued";
      return "badge-out";
    }

    function statusLabel(status) {
      if (status === "available") return "متوفر";
      if (status === "discontinued") return "متوقف";
      return "غير متوفر";
    }

    function renderTable(data) {
      const tbody = document.querySelector("#productTable tbody");

      if (!data.length) {
        tbody.innerHTML = `
          <tr><td colspan="7">
            <div class="empty-state">
              <div class="icon">📦</div>
              <div class="title">لا توجد منتجات مطابقة</div>
              <div>جرّب تعديل البحث</div>
            </div>
          </td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(product => {
        const sizesHTML = product.size_list.map(size =>
          `<div>${size.size}: ${size.price} د.أ</div>`
        ).join("");

        return `
          <tr>
            <td><img class="row-thumb" src="${product.p_image}" alt="${product.p_name}"></td>
            <td class="cell-strong">${product.p_name}</td>
            <td>${product.p_category}</td>
            <td class="num">${product.oil_percentage}% زيت / ${product.alcohol_percentage}% كحول</td>
            <td><span class="badge ${statusBadgeClass(product.status)}">${statusLabel(product.status)}</span></td>
            <td>${sizesHTML}</td>
            <td>
              <button class="btn btn-secondary btn-sm" onclick="editProduct('${product._id}')">🛠️ تعديل</button>
            </td>
          </tr>
        `;
      }).join("");
    }

    document.getElementById("searchName").addEventListener("input", filterProducts);
    document.getElementById("searchCategory").addEventListener("input", filterProducts);

    function filterProducts() {
      const name = document.getElementById("searchName").value.toLowerCase();
      const category = document.getElementById("searchCategory").value.toLowerCase();

      let filtered = productsData.filter(p =>
        p.p_name.toLowerCase().includes(name) &&
        p.p_category.toLowerCase().includes(category)
      );

      renderTable(filtered);
    }

    function editProduct(id) {
      window.location.href = `edit_product.html?id=${encodeURIComponent(id)}`;
    }

    fetchProducts();
  </script>
  <script src="../js/navbar.js"></script>
</body>
</html>
