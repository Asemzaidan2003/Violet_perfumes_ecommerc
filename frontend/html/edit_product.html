<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تعديل منتج</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
  <script src="../js/product-fields.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page page-narrow">
    <div class="page-head">
      <div>
        <span class="eyebrow">الكتالوج</span>
        <h2>تعديل المنتج</h2>
      </div>
    </div>

    <form id="editProductForm" class="form-card">
      <div class="field">
        <label for="p_name">اسم المنتج</label>
        <input type="text" id="p_name" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="p_category">الفئة</label>
          <select id="p_category" required></select>
        </div>
        <div class="field">
          <label for="p_offer_percentage">نسبة العرض %</label>
          <input type="number" id="p_offer_percentage">
        </div>
      </div>

      <div class="field">
        <label for="oil_id">ID الزيت</label>
        <input type="text" id="oil_id" required>
      </div>

      <div class="field">
        <label>نسب المكونات</label>
        <div class="field-row">
          <input type="number" step="0.01" id="oil_percentage" placeholder="نسبة الزيت %" required>
          <input type="number" step="0.01" id="alcohol_percentage" placeholder="نسبة الكحول %" required>
        </div>
      </div>

      <div class="field">
        <label for="status">الحالة</label>
        <select id="status">
          <option value="available">متوفر</option>
          <option value="out of stock">غير متوفر</option>
          <option value="discontinued">متوقف</option>
        </select>
      </div>

      <div class="field">
        <label for="p_image">رابط صورة المنتج</label>
        <input type="text" id="p_image" placeholder="https://...">
        <img id="imagePreview" class="image-preview mt-8" src="#" alt="معاينة الصورة" style="display:none;">
      </div>

      <div id="productExtras"></div>

      <div class="field">
        <label>الأحجام والأسعار</label>
        <div id="sizesContainer"></div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="addSize()">+ إضافة حجم</button>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">تحديث المنتج</button>
      </div>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");
    const sizesContainer = document.getElementById("sizesContainer");

    function addSize(size = '', price = '') {
      const div = document.createElement('div');
      div.className = "size-entry";
      div.innerHTML = `
        <input type="text" placeholder="الحجم بالمل (مثال: 30)" name="size" value="${size}" required>
        <input type="number" placeholder="السعر" name="price" value="${price}" required>
        <button type="button" class="btn-icon" onclick="this.parentElement.remove()">✕</button>
      `;
      sizesContainer.appendChild(div);
    }

    document.getElementById("p_image").addEventListener("input", function () {
      const url = this.value;
      const img = document.getElementById("imagePreview");
      if (url) {
        img.src = url;
        img.style.display = "block";
      } else {
        img.style.display = "none";
      }
    });

    async function fetchProduct() {
      try {
        const res = await fetch(`/api/products/${productId}`);
        const json = await res.json();
        const product = json.data;

        // Isolated so a rejected `ready` (network hiccup on the dynamic import,
        // already surfaced in #productExtras by product-fields.js itself) doesn't
        // also stop the unrelated core fields below from populating.
        try {
          const pf = await window.productFields.ready;
          pf.fill(product); // sets p_category too — its <select> options exist only after this resolves
        } catch (err) {
          console.error("فشل تحميل حقول المنتج الإضافية", err);
        }

        document.getElementById("p_name").value = product.p_name;
        document.getElementById("p_offer_percentage").value = product.p_offer_percentage;
        document.getElementById("oil_id").value = product.oil_id;
        document.getElementById("oil_percentage").value = product.oil_percentage;
        document.getElementById("alcohol_percentage").value = product.alcohol_percentage;
        document.getElementById("status").value = product.status;
        document.getElementById("p_image").value = product.p_image;
        document.getElementById("imagePreview").src = product.p_image;
        document.getElementById("imagePreview").style.display = "block";

        product.size_list.forEach(sizeObj => {
          addSize(sizeObj.size, sizeObj.price);
        });

      } catch (err) {
        console.error("فشل تحميل بيانات المنتج", err);
      }
    }

    document.getElementById("editProductForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const sizeEntries = document.querySelectorAll(".size-entry");
      const size_list = Array.from(sizeEntries).map(entry => ({
        size: entry.querySelector("input[name='size']").value,
        price: parseFloat(entry.querySelector("input[name='price']").value)
      }));

      try {
        const extras = (await window.productFields.ready).read();
        const data = {
          p_name: document.getElementById("p_name").value,
          p_category: document.getElementById("p_category").value,
          p_offer_percentage: parseFloat(document.getElementById("p_offer_percentage").value),
          oil_id: document.getElementById("oil_id").value,
          oil_percentage: parseFloat(document.getElementById("oil_percentage").value),
          alcohol_percentage: parseFloat(document.getElementById("alcohol_percentage").value),
          status: document.getElementById("status").value,
          p_image: document.getElementById("p_image").value,
          size_list: size_list,
          ...extras
        };
        const response = await fetch(`/api/products/${productId}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          throw new Error("فشل التحديث");
        }

        alert("تم تحديث المنتج بنجاح!");
        window.location.href = "all_products.html";

      } catch (err) {
        console.error(err);
        alert("حدث خطأ أثناء التحديث");
      }
    });

    fetchProduct();
  </script>
</body>
</html>
