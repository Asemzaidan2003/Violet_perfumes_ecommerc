<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شاشة المبيعات</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">نقطة البيع</span>
        <h2>نظام المبيعات</h2>
      </div>
    </div>

    <!-- قسم الزبون -->
    <div class="card card-pad mb-16">
      <div class="panel-head">
        <h3>بيانات الزبون</h3>
      </div>
      <div class="field-row" style="align-items:flex-end;">
        <div class="field" style="margin-bottom:0;">
          <label for="customerPhone">رقم هاتف الزبون</label>
          <input type="text" id="customerPhone" placeholder="ادخل رقم الهاتف" />
        </div>
        <button class="btn btn-primary" onclick="checkCustomer()">تحقق</button>
        <button class="btn btn-secondary"
          onclick="document.getElementById('customerModal').classList.add('open'); getAllCustomers();">
          اختيار من القائمة
        </button>
      </div>

      <div id="customerInfo" class="customer-info-msg"></div>

      <div id="newCustomerForm" class="field mt-16" style="display: none;">
        <label for="customerName">اسم الزبون:</label>
        <input type="text" id="customerName" placeholder="ادخل اسم الزبون" />
      </div>
      <input type="hidden" id="customer_id" />
      <div id="selectedCustomerName" class="customer-selected-msg"></div>
    </div>

    <div class="pos-layout">
      <!-- قسم المنتجات -->
      <div class="card card-pad">
        <div class="panel-head">
          <h3>البحث عن منتج</h3>
          <button class="btn btn-ghost btn-sm" onclick="getAllProducts()">🔄 تحديث</button>
        </div>
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="اكتب اسم المنتج..." oninput="filterProducts()" />
        </div>
        <div class="product-grid" id="productList"></div>
      </div>

      <!-- قسم السلة -->
      <div class="card card-pad">
        <div class="panel-head">
          <h3>سلة المشتريات</h3>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>المنتج</th>
                <th>الحجم</th>
                <th>الكمية</th>
                <th>السعر</th>
                <th>الإجمالي</th>
                <th>الزجاجة</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cartTable">
              <tr>
                <td colspan="7">
                  <div class="empty-state" style="padding:24px;">
                    <div class="icon">🛒</div>السلة فارغة
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="cart-total-bar">
          <span class="text-muted" style="font-weight:700;">المجموع</span>
          <span class="amount" id="totalPrice">0.00 JOD</span>
        </div>
        <button class="btn btn-primary btn-block mt-16" id="checkout">إنهاء الطلب</button>
      </div>
    </div>
  </div>

  <!-- مودال اختيار الزبون -->
  <div class="modal-overlay" id="customerModal">
    <div class="modal-box" id="customerModalContent">
      <button class="modal-close" onclick="closeCustomerModal()">✕</button>
      <h3>اختيار الزبون</h3>
      <input type="text" id="searchCustomer" placeholder="ابحث باسم الزبون..." class="mb-16" />
      <ul id="customerList" class="pick-list"></ul>
    </div>
  </div>

  <!-- مودال إضافة للسلة -->
  <div class="modal-overlay" id="overlay">
    <div class="modal-box" id="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>إضافة للسلة</h3>
      <div id="modalContent"></div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="confirmAddToCart()">إضافة</button>
        <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/checkOut.js"></script>

  <script>
    const baseURL = "/api";
    let products = [];
    const cart = [];
    let bottles = [];

    let total_items = 0;
    let total_amount = 0;

    let selectedProduct = null;

    // بيانات الزبون الحالية
    let currentCustomer = null;

    // جلب كل المنتجات
    function getAllProducts() {
      fetch(`${baseURL}/products`)
        .then((response) => response.json())
        .then((data) => {
          products = data.data;
          renderProducts(products);
        })
        .catch((error) => console.error("Error fetching products:", error));
    }

    // عرض المنتجات
    function renderProducts(list) {
      const container = document.getElementById("productList");

      if (!list.length) {
        container.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">لا توجد منتجات مطابقة</div>`;
        return;
      }

      container.innerHTML = list.map((product) => `
        <div class="product-card">
          <img src="${product.p_image}" alt="${product.p_name}">
          <div class="name">${product.p_name}</div>
          <button class="btn btn-primary btn-sm" onclick='openModal("${product._id}")'>أضف</button>
        </div>
      `).join("");
    }

    // فلترة المنتجات
    function filterProducts() {
      const search = document
        .getElementById("searchInput")
        .value.toLowerCase();
      const filtered = products.filter((p) =>
        p.p_name.toLowerCase().includes(search)
      );
      renderProducts(filtered);
    }

    // فتح مودال إضافة للسلة
    function openModal(productId) {
      selectedProduct = products.find((p) => p._id === productId);
      const content = document.getElementById("modalContent");
      content.innerHTML = `
        <div class="field">
          <label>اختر الحجم</label>
          <select id="sizeSelect">
            ${selectedProduct.size_list
          .map(
            (s) =>
              `<option value="${s.size}">${s.size} - ${s.price} JOD</option>`
          )
          .join("")}
          </select>
        </div>
        <div class="field">
          <label>الكمية</label>
          <input type="number" id="quantityInput" value="1" min="1" />
        </div>
      `;
      document.getElementById("overlay").classList.add("open");
    }

    // إغلاق المودال
    function closeModal() {
      document.getElementById("overlay").classList.remove("open");
      selectedProduct = null;
    }

    // تأكيد إضافة للسلة
    function confirmAddToCart() {
      const size = document.getElementById("sizeSelect").value;
      const quantity = parseInt(
        document.getElementById("quantityInput").value
      );
      const price = selectedProduct.size_list.find(
        (s) => s.size === size
      ).price;

      cart.push({
        id: selectedProduct._id,
        name: selectedProduct.p_name,
        size,
        quantity,
        price,
        total: price * quantity,
        oil_id: selectedProduct.oil_id,
        oil_percentage: selectedProduct.oil_percentage,
        alcohol_percentage: selectedProduct.alcohol_percentage,
      });
      renderCart();
      closeModal();
    }

    // تحديث عنصر في السلة
    function updateCartItem(index, field, value) {
      if (field === "quantity") {
        cart[index].quantity = parseFloat(value);
        if (cart[index].bottle) {
          cart[index].bottle.quantity = cart[index].quantity;
        }
      } else if (field === "price") {
        cart[index].price = parseFloat(value);
      } else if (field === "bottle_id") {
        cart[index].bottle = {
          bottle_id: value,
          quantity: cart[index].quantity,
        };
      }

      cart[index].total = cart[index].quantity * cart[index].price;
      renderCart();
    }

    // جلب الزجاجات
    function getAllBottles() {
      fetch(`${baseURL}/bottles`)
        .then((response) => response.json())
        .then((data) => {
          bottles = data.data;
        })
        .catch((error) => console.error("Error fetching bottles:", error));
    }

    // عرض السلة
    function renderCart() {
      const table = document.getElementById("cartTable");
      total_items = 0;
      total_amount = 0;

      if (!cart.length) {
        table.innerHTML = `<tr><td colspan="7"><div class="empty-state" style="padding:24px;"><div class="icon">🛒</div>السلة فارغة</div></td></tr>`;
        document.getElementById("totalPrice").innerText = `0.00 JOD`;
        return;
      }

      table.innerHTML = cart.map((item, index) => {
        total_items += item.quantity;
        total_amount += item.total;

        const bottleOptions = bottles
          .filter((b) => b.capacity === parseFloat(item.size))
          .map((b) => {
            const selected =
              item.bottle?.bottle_id === b._id ? "selected" : "";
            return `<option value="${b._id}" ${selected}>${b.name} (المتوفر: ${b.quantity})</option>`;
          })
          .join("");

        return `
        <tr>
          <td class="cell-strong">${item.name}</td>
          <td>${item.size}</td>
          <td>
            <input class="qty-input" type="number" value="${item.quantity}" min="1"
              onchange="updateCartItem(${index}, 'quantity', this.value)">
          </td>
          <td>
            <input class="price-input" type="number" value="${item.price}" min="0"
              onchange="updateCartItem(${index}, 'price', this.value)">
          </td>
          <td class="num">${item.total.toFixed(2)}</td>
          <td>
            <select onchange="updateCartItem(${index}, 'bottle_id', this.value)">
              <option value="">اختر زجاجة</option>
              ${bottleOptions}
            </select>
          </td>
          <td><button class="btn-icon" onclick="removeItem(${index})">🗑️</button></td>
        </tr>
      `;
      }).join("");

      document.getElementById(
        "totalPrice"
      ).innerText = `${total_amount.toFixed(2)} JOD`;
    }

    // حذف عنصر من السلة
    function removeItem(index) {
      cart.splice(index, 1);
      renderCart();
    }

    async function getAllCustomers() {
      try {
        const res = await fetch(`${baseURL}/customers`);
        if (res.ok) {
          const data = await res.json();
          window.allCustomers = data; // Store globally
          renderCustomerList(data);
        } else {
          console.error("حدث خطأ أثناء جلب الزبائن.");
        }
      } catch (error) {
        console.error(error);
      }
    }

    // تحقق من الزبون برقم الهاتف
    async function checkCustomer() {
      const phone = document.getElementById("customerPhone").value.trim();
      if (!phone) {
        alert("يرجى إدخال رقم الهاتف");
        return;
      }

      try {
        const res = await fetch(`${baseURL}/customers/phone/${phone}`);
        if (res.ok) {
          const data = await res.json();
          console.log(data);
          if (data.customer._id) {
            currentCustomer = data.customer;
            console.log(currentCustomer);
            document.getElementById(
              "customerInfo"
            ).innerText = `الزبون موجود: ${currentCustomer.name || "-"
            }، يمكنك متابعة الطلب.`;
            document.getElementById("newCustomerForm").style.display = "none";
          } else {
            currentCustomer = null;
            document.getElementById("customerInfo").innerText =
              "الزبون غير موجود، سيتم إنشاء زبون جديد.";
            document.getElementById("newCustomerForm").style.display =
              "block";
          }
        } else {
          currentCustomer = null;
          document.getElementById("customerInfo").innerText =
            "حدث خطأ أثناء التحقق من الزبون.";
          document.getElementById("newCustomerForm").style.display = "none";
        }
      } catch (error) {
        console.error(error);
        alert("خطأ في الاتصال بالخادم");
      }
    }

    // إنهاء الطلب
    document.getElementById("checkout").onclick = async () => {
      // التحقق من السلة
      let valid = true;
      let errorMsg = "";

      cart.forEach((item, idx) => {
        if (!item.size || !item.quantity) {
          valid = false;
          errorMsg += `يوجد حقل فارغ في المنتج رقم ${idx + 1}\n`;
        }
        if (!item.bottle || !item.bottle.bottle_id) {
          valid = false;
          errorMsg += `يرجى اختيار زجاجة للمنتج رقم ${idx + 1}\n`;
        }
      });

      if (!valid) {
        alert(
          errorMsg ||
          "يرجى تعبئة جميع الحقول واختيار الزجاجة لكل منتج في السلة."
        );
        return;
      }

      // تحقق من الزبون
      let customerId = document.getElementById("customer_id").value || null;

      if (currentCustomer) {
        customerId = currentCustomer._id;
      } else {
        const name = document.getElementById("customerName").value.trim();
        const phone = document.getElementById("customerPhone").value.trim();

        if (!name) {
          console.log(customerId)
          alert("يرجى إدخال اسم الزبون الجديد");
          return;
        }

        const res = await fetch(`${baseURL}/customers`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, phone }),
        });
        if (res.ok) {
          const data = await res.json();
          console.log(data);
          customerId = data._id;
          currentCustomer = data.customer;
        } else {
          alert("فشل إنشاء الزبون الجديد");
          return;
        }
      }

      // إرسال الطلب مع customer_id
      checkout({
        products: cart,
        total_items,
        total_price: total_amount,
        customer_id: customerId,
      });
    };
    function closeCustomerModal() {
      document.getElementById("customerModal").classList.remove("open");
    }
    function renderCustomerList(customers) {
      const list = document.getElementById("customerList");
      list.innerHTML = "";
      customers.forEach((customer) => {
        const li = document.createElement("li");
        li.textContent = customer.name;
        li.addEventListener("click", () => selectCustomer(customer));
        list.appendChild(li);
      });
    }
    function selectCustomer(customer) {
      document.getElementById("customer_id").value = customer._id;
      currentCustomer = customer;
      document.getElementById(
        "selectedCustomerName"
      ).textContent = `تم اختيار: ${customer.name}`;
      closeCustomerModal();
    }

    document
      .getElementById("searchCustomer")
      .addEventListener("input", function () {
        const searchTerm = this.value.toLowerCase();
        const filtered = window.allCustomers.filter((c) =>
          c.name.toLowerCase().includes(searchTerm)
        );
        renderCustomerList(filtered);
      });
    // تحميل البيانات الأولية
    getAllProducts();
    getAllBottles();
    renderCart();
  </script>
  <script src="../js/navbar.js"></script>
</body>

</html>
