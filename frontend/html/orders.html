<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <title>عرض الطلبات</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        direction: rtl;
        background-color: #f7f7f7;
        margin: 0;
      }

      h2 {
        text-align: center;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 20px;
        background-color: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      }

      .filters label {
        display: flex;
        flex-direction: column;
        font-weight: bold;
      }

      .totals {
        margin: 10px 0 20px;
        font-size: 18px;
        font-weight: bold;
        background-color: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background-color: #fff;
      }

      th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
      }

      th {
        background-color: #eee;
      }

      button {
        cursor: pointer;
        padding: 6px 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
      }

      button:hover {
        background-color: #0056b3;
      }

      /* Style for the status select */
      .status-select {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #ccc;
        font-size: 14px;
        appearance: none; /* Remove default arrow */
        background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
        background-repeat: no-repeat;
        background-position: right 8px top 50%;
        background-size: 16px;
        padding-right: 30px; /* Make space for the arrow */
        cursor: pointer;
      }

      /* Style for the options */
      .status-select option {
        padding: 8px;
        font-size: 14px;
      }

      /* Hover effect for options */
      .status-select option:hover {
        background-color: #f0f0f0;
      }

      /* Focus style for the select */
      .status-select:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
      }
      .container{
        padding: 20px;
      }
      .filters {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  padding: 1rem;
  background-color: #f9f9f9;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  margin-bottom: 1.5rem;
  font-family: 'Segoe UI', sans-serif;
}

.filters label {
  display: flex;
  flex-direction: column;
  font-weight: 500;
  font-size: 14px;
  color: #333;
}

.filters input,
.filters select {
  margin-top: 0.4rem;
  padding: 8px 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 14px;
  transition: border-color 0.2s;
}

.filters input:focus,
.filters select:focus {
  border-color: #0ea5e9;
  outline: none;
}

.filters button {
  padding: 10px 16px;
  background-color: #0ea5e9;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.2s;
}

.filters button:hover {
  background-color: #0284c7;
}
      /* Status-based colors */
      .status-pending {
        background-color: #ffc107; /* Yellow */
        color: #212529;
      }

      .status-completed {
        background-color: #28a745; /* Green */
        color: white;
      }

      .status-canceled {
        background-color: #dc3545; /* Red */
        color: white;
      }

      .status-ready-for-delivery {
        background-color: #17a2b8; /* Cyan */
        color: white;
      }

      .status-in-delivery {
        background-color: #007bff; /* Blue */
        color: white;
      }

      .status-uncollected-payment {
        background-color: #6c757d; /* Gray */
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="navbar"></div>
    <h2>قائمة الطلبات</h2>
    <div class="container">
      <div class="filters">
        <label>
          الحالة:
          <select id="statusFilter">
            <option value="">الكل</option>
            <option value="pending">قيد الانتظار</option>
            <option value="completed">مكتمل</option>
            <option value="canceled">ملغي</option>
            <option value="ready for delivery">جاهز للتوصيل</option>
            <option value="in delivery">قيد التوصيل</option>
            <option value="uncollected payment">دفعة غير مستلمة</option>
          </select>
        </label>

        <label>
          من تاريخ:
          <input type="date" id="fromDate" />
        </label>

        <label>
          إلى تاريخ:
          <input type="date" id="toDate" />
        </label>

        <label>
          طريقة الدفع:
          <select id="paymentFilter">
            <option value="">الكل</option>
            <option value="Cash">كاش</option>
            <option value="Credit">بطاقة</option>
          </select>
        </label>
        <label>
          البحث (اسم أو رقم):
          <input type="text" id="searchInput" placeholder="أدخل الاسم أو رقم الهاتف" />
        </label>

        <div style="display: flex; align-items: flex-end;">
          <button onclick="applyFilters()">🔍 فلترة</button>
        </div>
      </div>

      <div class="totals" id="totals">
        مجموع المبيعات: 0 JOD | مجموع الأرباح: 0 JOD
      </div>

      <table>
        <thead>
          <tr>
            <th>رقم</th>
            <th>اسم الزبون</th>
            <th>رقم الهاتف</th>
            <th>عدد المنتجات</th>
            <th>الإجمالي</th>
            <th>الربح</th>
            <th>الحالة</th>
            <th>تاريخ الإنشاء</th>
          </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
      </table>
    </div>
    <script>
      const baseURL = "http://localhost:5000/api";

      async function fetchOrders() {
        try {
          const res = await fetch(`${baseURL}/orders`);
          const data = await res.json();
          return data.data;
        } catch (err) {
          console.error("Error fetching orders:", err);
          return [];
        }
      }

      async function fetchCustomerById(id) {
        try {
          const res = await fetch(`${baseURL}/customers/${id}`);
          if (!res.ok) return null;
          const data = await res.json();
          return data
        } catch (err) {
          console.error("Error fetching customer:", err);
          return null;
        }
      }

      async function updateOrderStatus(id, newStatus) {
        try {
          await fetch(`${baseURL}/orders/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: newStatus }),
          });
        } catch (err) {
          console.error("Error updating order status:", err);
        }
      }

    async function loadOrders() {
      const orders = await fetchOrders();

      for (const order of orders) {
        if (order.customer_id) {
          const customer = await fetchCustomerById(order.customer_id);
          order.customer = customer;
        } else {
          order.customer = { name: "-", phone: "-" };
        }
      }

      const today = new Date();
      window._allOrders = orders;

      // مثلا عرض طلبات اليوم في البداية
      const todayOrders = orders.filter(order => {
        const createdAt = new Date(order.createdAt);
        return createdAt.toDateString() === today.toDateString();
      });

      window._filteredOrders = todayOrders; // خزن البيانات المعروضة حالياً
      renderOrders(window._filteredOrders);
    }


      function renderOrders(orders) {
        const tbody = document.getElementById("ordersTable");
        tbody.innerHTML = "";

        let totalSales = 0;
        let totalProfit = 0;

        orders.forEach((order, index) => {
          totalSales += order.final_total;

          if (order.status == "completed") {
            totalProfit += order.total_profit;
          }
          console.log("order data : ",order)
          tbody.innerHTML += `
            <tr>
              <td>${index + 1}</td>
              <td>${order.customer && order.customer.name ? order.customer.name : "-"}</td>
              <td>${order.customer && order.customer.phone ? order.customer.phone : "-"}</td>
              <td>${order.total_items}</td>
              <td>${order.final_total.toFixed(2)} JOD</td>
              <td>${order.status == "completed" ? order.total_profit.toFixed(2) + " JOD" : "-"}</td>
              <!--<td>${order.payment_method}</td>-->
              <td>
                <select class="status-select ${getStatusClass(order.status)}" onchange="handleStatusChange('${order._id}', this)">
                  <option value="pending" ${order.status === "pending" ? "selected" : ""}>قيد الانتظار</option>
                  <option value="completed" ${order.status === "completed" ? "selected" : ""}>مكتمل</option>
                  <option value="canceled" ${order.status === "canceled" ? "selected" : ""}>ملغي</option>
                  <option value="ready for delivery" ${order.status === "ready for delivery" ? "selected" : ""}>جاهز للتوصيل</option>
                  <option value="in delivery" ${order.status === "in delivery" ? "selected" : ""}>قيد التوصيل</option>
                  <option value="uncollected payment" ${order.status === "uncollected payment" ? "selected" : ""}>دفعة غير مستلمة</option>
                </select>
              </td>
              <!--<td>${order.order_notes || "-"}</td>-->
              <td>${new Date(order.createdAt).toLocaleDateString()}</td>
              <td><button onclick="goToDetails('${order._id}')">عرض</button></td>
            </tr>
          `;
        });

        document.getElementById("totals").innerText = `مجموع المبيعات: ${totalSales.toFixed(2)} JOD | مجموع الأرباح: ${totalProfit.toFixed(2)} JOD`;
      }

      function applyFilters() {
        const status = document.getElementById("statusFilter").value;
        const payment = document.getElementById("paymentFilter").value;
        const fromDate = document.getElementById("fromDate").value;
        const toDate = document.getElementById("toDate").value;
        const searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();

        let filtered = window._allOrders;

        if (status) filtered = filtered.filter(o => o.status === status);
        if (payment) filtered = filtered.filter(o => o.payment_method === payment);

        if (fromDate) {
          const from = new Date(fromDate);
          filtered = filtered.filter(o => new Date(o.createdAt) >= from);
        }

        if (toDate) {
          const to = new Date(toDate);
          // اضبط الوقت لآخر اليوم
          to.setHours(23, 59, 59, 999);
          filtered = filtered.filter(o => new Date(o.createdAt) <= to);
        }

        if (searchQuery) {
          filtered = filtered.filter(o => {
            const name = o.customer?.name?.toLowerCase() || "";
            const phone = o.customer?.phone || "";
            return name.includes(searchQuery) || phone.includes(searchQuery);
          });
        }
          window._filteredOrders = filtered;
        renderOrders(window._filteredOrders);
      }

      function goToDetails(id) {
        window.location.href = `order-details.html?id=${id}`;
      }

    async function handleStatusChange(id, selectElement) {
      const newStatus = selectElement.value;
      await updateOrderStatus(id, newStatus);

      // حدّث الحالة في القائمة الكاملة
      const orderInAll = window._allOrders.find(o => o._id === id);
      if (orderInAll) {
        orderInAll.status = newStatus;
      }

      // حدّث الحالة في القائمة المعروضة فقط
      const orderInFiltered = window._filteredOrders.find(o => o._id === id);
      if (orderInFiltered) {
        orderInFiltered.status = newStatus;
      }

      // إعادة رسم الجدول باستخدام البيانات المعروضة حالياً فقط
      renderOrders(window._filteredOrders);
    }

      // Helper function to get the status class
      function getStatusClass(status) {
        switch (status) {
          case "pending":
            return "status-pending";
          case "completed":
            return "status-completed";
          case "canceled":
            return "status-canceled";
          case "ready for delivery":
            return "status-ready-for-delivery";
          case "in delivery":
            return "status-in-delivery";
          case "uncollected payment":
            return "status-uncollected-payment";
          default:
            return "";
        }
      }

      loadOrders();
    </script>
    <script src="../js/navbar.js"></script>
  </body>
</html>
