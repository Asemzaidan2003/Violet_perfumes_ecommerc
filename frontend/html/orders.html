<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عرض الطلبات</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/navbar.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <div class="page">
    <div class="page-head">
      <div>
        <span class="eyebrow">لوحة التحكم</span>
        <h2>قائمة الطلبات</h2>
      </div>
      <span class="sub" id="orderCount"></span>
    </div>

    <div class="filters">
      <label>
        الحالة
        <select id="statusFilter">
          <option value="">الكل</option>
          <option value="unconfirmed">بانتظار التأكيد</option>
          <option value="pending">قيد الانتظار</option>
          <option value="completed">مكتمل</option>
          <option value="canceled">ملغي</option>
          <option value="ready for delivery">جاهز للتوصيل</option>
          <option value="in delivery">قيد التوصيل</option>
          <option value="uncollected payment">دفعة غير مستلمة</option>
        </select>
      </label>

      <label>
        من تاريخ
        <input type="date" id="fromDate" />
      </label>

      <label>
        إلى تاريخ
        <input type="date" id="toDate" />
      </label>

      <label>
        طريقة الدفع
        <select id="paymentFilter">
          <option value="">الكل</option>
          <option value="Cash">كاش</option>
          <option value="Credit">بطاقة</option>
        </select>
      </label>

      <label>
        البحث (اسم أو رقم)
        <input type="text" id="searchInput" placeholder="أدخل الاسم أو رقم الهاتف" />
      </label>

      <div class="actions">
        <button class="btn btn-ghost" onclick="resetFilters()">إعادة تعيين</button>
        <button class="btn btn-primary" onclick="applyFilters()">فلترة</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card sales">
        <div class="label">مجموع المبيعات</div>
        <div class="value" id="totalSalesValue">0 <small>JOD</small></div>
      </div>
      <div class="stat-card accent">
        <div class="label">مجموع الأرباح</div>
        <div class="value" id="totalProfitValue">0 <small>JOD</small></div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>رقم</th>
              <th>اسم الزبون</th>
              <th>رقم الهاتف</th>
              <th>عدد المنتجات</th>
              <th>الإجمالي</th>
              <th>الربح</th>
              <th>الحالة</th>
              <th>تاريخ الإنشاء</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ordersTable">
            <tr class="loading-row">
              <td colspan="9"><span class="spinner"></span>جاري تحميل الطلبات...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const baseURL = "/api";

    // Simple in-memory cache so we never re-fetch the same customer twice across loads/filters
    const customerCache = new Map();

    async function fetchOrders() {
      try {
        const res = await fetch(`${baseURL}/orders`);
        const data = await res.json();
        return data.data;
      } catch (err) {
        console.error("Error fetching orders:", err);
        return [];
      }
    }

    async function fetchCustomerById(id) {
      if (customerCache.has(id)) return customerCache.get(id);
      try {
        const res = await fetch(`${baseURL}/customers/${id}`);
        if (!res.ok) return null;
        const data = await res.json();
        customerCache.set(id, data);
        return data;
      } catch (err) {
        console.error("Error fetching customer:", err);
        return null;
      }
    }

    async function updateOrderStatus(id, newStatus) {
      try {
        const res = await fetch(`${baseURL}/orders/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus }),
        });
        if (res.ok) return true;
        const data = await res.json().catch(() => ({}));
        alert(data.message || "تعذر تحديث حالة الطلب");
      } catch (err) {
        console.error("Error updating order status:", err);
        alert("تعذر تحديث حالة الطلب");
      }
      return false;
    }

    async function loadOrders() {
      const orders = await fetchOrders();

      // Collect unique customer IDs (many orders can share the same customer)
      const uniqueCustomerIds = [...new Set(orders.map(o => o.customer_id).filter(Boolean))];

      // Fetch ALL customers in PARALLEL instead of one-by-one in a sequential loop
      const customerEntries = await Promise.all(
        uniqueCustomerIds.map(async (id) => [id, await fetchCustomerById(id)])
      );
      const customerMap = new Map(customerEntries);

      for (const order of orders) {
        order.customer = order.customer_id
          ? (customerMap.get(order.customer_id) || { name: "-", phone: "-" })
          : { name: "-", phone: "-" };
      }

      const today = new Date();
      window._allOrders = orders;

      // مثلا عرض طلبات اليوم في البداية
      const todayOrders = orders.filter(order => {
        const createdAt = new Date(order.createdAt);
        return createdAt.toDateString() === today.toDateString();
      });

      window._filteredOrders = todayOrders;
      renderOrders(window._filteredOrders);

      // POS link: orders.html?filter=unconfirmed
      const preset = new URLSearchParams(window.location.search).get("filter");
      if (preset) {
        document.getElementById("statusFilter").value = preset;
        applyFilters();
      }
    }

    function renderOrders(orders) {
      const tbody = document.getElementById("ordersTable");
      const orderCountEl = document.getElementById("orderCount");

      if (!orders.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9">
              <div class="empty-state">
                <div class="icon">🗒️</div>
                <div class="title">لا توجد طلبات مطابقة</div>
                <div>جرّب تعديل الفلاتر أو نطاق التاريخ</div>
              </div>
            </td>
          </tr>`;
        document.getElementById("totalSalesValue").innerHTML = `0 <small>JOD</small>`;
        document.getElementById("totalProfitValue").innerHTML = `0 <small>JOD</small>`;
        if (orderCountEl) orderCountEl.textContent = "";
        return;
      }

      let totalSales = 0;
      let totalProfit = 0;

      const rowsHtml = orders.map((order, index) => {
        totalSales += order.final_total;

        if (order.status === "completed") {
          totalProfit += order.total_profit;
        }

        return `
          <tr>
            <td>${index + 1}</td>
            <td class="cell-strong">${order.customer && order.customer.name ? order.customer.name : "-"}${order.stock_deducted === false && order.status !== "canceled" ? ' <span class="badge badge-pending">بانتظار التأكيد</span>' : ""}</td>
            <td class="num">${order.customer && order.customer.phone ? order.customer.phone : "-"}</td>
            <td>${order.total_items}</td>
            <td class="num">${order.final_total.toFixed(2)} JOD</td>
            <td class="num">${order.status === "completed" ? order.total_profit.toFixed(2) + " JOD" : "-"}</td>
            <td>
              <select class="status-select ${getStatusClass(order.status)}" onchange="handleStatusChange('${order._id}', this)">
                <option value="pending" ${order.status === "pending" ? "selected" : ""}>قيد الانتظار</option>
                <option value="completed" ${order.status === "completed" ? "selected" : ""}>مكتمل</option>
                <option value="canceled" ${order.status === "canceled" ? "selected" : ""}>ملغي</option>
                <option value="ready for delivery" ${order.status === "ready for delivery" ? "selected" : ""}>جاهز للتوصيل</option>
                <option value="in delivery" ${order.status === "in delivery" ? "selected" : ""}>قيد التوصيل</option>
                <option value="uncollected payment" ${order.status === "uncollected payment" ? "selected" : ""}>دفعة غير مستلمة</option>
              </select>
            </td>
            <td class="date-cell">${new Date(order.createdAt).toLocaleDateString()}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="goToDetails('${order._id}')">عرض</button></td>
          </tr>
        `;
      }).join("");

      tbody.innerHTML = rowsHtml;

      document.getElementById("totalSalesValue").innerHTML = `${totalSales.toFixed(2)} <small>JOD</small>`;
      document.getElementById("totalProfitValue").innerHTML = `${totalProfit.toFixed(2)} <small>JOD</small>`;
      if (orderCountEl) orderCountEl.textContent = `${orders.length} طلب`;
    }

    function applyFilters() {
      const status = document.getElementById("statusFilter").value;
      const payment = document.getElementById("paymentFilter").value;
      const fromDate = document.getElementById("fromDate").value;
      const toDate = document.getElementById("toDate").value;
      const searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();

      let filtered = window._allOrders || [];

      if (status === "unconfirmed") filtered = filtered.filter(o => o.stock_deducted === false && o.status !== "canceled");
      else if (status) filtered = filtered.filter(o => o.status === status);
      if (payment) filtered = filtered.filter(o => o.payment_method === payment);

      if (fromDate) {
        const from = new Date(fromDate);
        filtered = filtered.filter(o => new Date(o.createdAt) >= from);
      }

      if (toDate) {
        const to = new Date(toDate);
        to.setHours(23, 59, 59, 999);
        filtered = filtered.filter(o => new Date(o.createdAt) <= to);
      }

      if (searchQuery) {
        filtered = filtered.filter(o => {
          const name = o.customer?.name?.toLowerCase() || "";
          const phone = o.customer?.phone || "";
          return name.includes(searchQuery) || phone.includes(searchQuery);
        });
      }
      window._filteredOrders = filtered;
      renderOrders(window._filteredOrders);
    }

    function resetFilters() {
      document.getElementById("statusFilter").value = "";
      document.getElementById("paymentFilter").value = "";
      document.getElementById("fromDate").value = "";
      document.getElementById("toDate").value = "";
      document.getElementById("searchInput").value = "";
      window._filteredOrders = window._allOrders || [];
      renderOrders(window._filteredOrders);
    }

    function goToDetails(id) {
      window.location.href = `order-details.html?id=${id}`;
    }

    async function handleStatusChange(id, selectElement) {
      const newStatus = selectElement.value;
      if (await updateOrderStatus(id, newStatus)) {
        const orderInAll = (window._allOrders || []).find(o => o._id === id);
        if (orderInAll) orderInAll.status = newStatus;
        const orderInFiltered = (window._filteredOrders || []).find(o => o._id === id);
        if (orderInFiltered) orderInFiltered.status = newStatus;

        if (newStatus === "canceled") {
          if (orderInAll) orderInAll.stock_deducted = false;
          if (orderInFiltered) orderInFiltered.stock_deducted = false;
        }
      }
      renderOrders(window._filteredOrders); // on failure this reverts the select
    }

    function getStatusClass(status) {
      switch (status) {
        case "pending": return "status-pending";
        case "completed": return "status-completed";
        case "canceled": return "status-canceled";
        case "ready for delivery": return "status-ready-for-delivery";
        case "in delivery": return "status-in-delivery";
        case "uncollected payment": return "status-uncollected-payment";
        default: return "";
      }
    }

    loadOrders();
  </script>
</body>
</html>
